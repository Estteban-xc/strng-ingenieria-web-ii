name: STRNG CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/strng_ci
      PORT: 3001
      JWT_SECRET: ci-only-jwt-secret
      REFRESH_TOKEN_SECRET: ci-only-refresh-secret
      ACCESS_TOKEN_TTL: 15m
      CORS_ORIGINS: http://localhost:5173
      NODE_ENV: test
      TEST_ADMIN_PASSWORD: strng2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci --ignore-scripts


      - name: Build client
        working-directory: client
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm ci --ignore-scripts


      - name: Start API
        working-directory: server
        run: node index.js > ../strng-api.log 2>&1 &

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat strng-api.log
          exit 1

      - name: Run API smoke tests
        working-directory: server
        run: npm run test:api

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd

      - name: Validate Terraform configuration
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
